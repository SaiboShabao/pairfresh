[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pairfresh"
version = "0.1.0"
description = "Fail-closed freshness checks for paired market snapshots in JSONL"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
pairfresh = "pairfresh:main"

[tool.setuptools]
py-modules = ["pairfresh"]
